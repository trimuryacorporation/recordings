services:
  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: trimurya_recording
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/trimurya_recording
      REDIS_URL: redis://redis:6379
    depends_on:
      - mongodb
      - redis
    ports:
      - "4000:4000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mongo-data:
